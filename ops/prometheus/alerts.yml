# Prometheus alert rules for opendevops — the operability cross-checks.
#
# The server exporter publishes webhook counters, audit-derived policy denials, daily-counter
# spend/caps, and scheduler success timestamps. Vector publishes its own component metrics.

groups:
  # -- policy-denial spike (bypass-probing signal) -------------------------------------
  - name: opendevops-policy
    rules:
      # LIVE: a burst of webhook-layer auth failures — someone probing the ingress with bad tokens.
      - alert: WebhookUnauthorizedSpike
        expr: sum(rate(opendevops_webhook_requests_total{outcome="unauthorized"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Elevated unauthorized webhook requests (possible ingress probing)"
          description: "> 0.2 unauthorized webhook req/s for 10m — check source IPs and the gateway token."

      # A spike in tool-layer policy DENY decisions (argv-bypass probing).
      - alert: PolicyDenialSpike
        expr: sum(rate(opendevops_policy_denials_total[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Policy-denial rate elevated (possible bypass probing)"
          description: "Tool-call denials > 0.5/s for 10m — inspect the audit log for the offending run."

  # -- daily spend > 80% of cap ------------------------------------------------------
  - name: opendevops-budget
    rules:
      # The exporter reads the same configured daily counter used by the budget middleware.
      - alert: DailySpendOver80Percent
        expr: |
          opendevops_daily_spend_usd{scope="global"}
            / on() opendevops_daily_cap_usd{scope="global"} > 0.8
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Global daily spend over 80% of cap"
          description: "Daily USD envelope {{ $value | humanizePercentage }} consumed — runs will start refusing at 100%."

  # -- scheduler silence > 1.5x period ------------------------------------------
  - name: opendevops-scheduler
    rules:
      # The scheduler records each successful job completion in Redis; the server exports it.
      - alert: SchedulerSilence
        expr: time() - opendevops_scheduler_last_success_timestamp_seconds > 1.5 * 86400
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Scheduled job {{ $labels.job_id }} silent for over 36h"
          description: "No successful {{ $labels.job_id }} run in over 36h — the scheduler or job may be failing."

  # -- audit-shipper lag -------------------------------------------------------------
  - name: opendevops-audit-shipper
    rules:
      # LIVE: Vector is down / unscrapable — audit lines stop reaching the durable sink.
      - alert: AuditShipperDown
        expr: up{job="vector"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Vector audit shipper is down"
          description: "The audit shipper has been unscrapable for 5m — audit lines are not reaching the durable sink."

      # LIVE: Vector is receiving audit events but the durable sink has sent none for 10m (a stalled
      # or erroring sink) — the lag signal.
      - alert: AuditShipperLag
        expr: |
          sum(rate(vector_component_received_events_total{component_id="audit_chains"}[10m])) > 0
            and sum(rate(vector_component_sent_events_total{component_id="durable_spool"}[10m])) == 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit shipper is lagging"
          description: "Vector is reading audit events but the durable spool sink has emitted none for 10m."

      # LIVE: the sink is erroring outright.
      - alert: AuditShipperErrors
        expr: sum(rate(vector_component_errors_total{component_id="durable_spool"}[10m])) > 0
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Audit shipper sink errors"
          description: "Vector's durable_spool sink is reporting errors — audit shipping may be partial."
