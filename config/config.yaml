targets:
  kubernetes:
    kubeconfig_ro: ~/.kube/agent-view.yaml   # generated; contains ONLY allowed contexts
    kubeconfig_rw: null                      # generated with --rw; staging mutations only
    allowed_contexts: []                     # OPEN QUESTION 1 — must be filled before first live run
  github:
    token_env: null                          # set to the name of an env var holding a read-only fine-grained PAT, e.g. OPENDEVOPS_GH_TOKEN
    # gh-write: staging-only PR-based remediation. token_env_rw names the env var holding a
    # fine-grained WRITE PAT (distinct from the read PAT); unset => the gh-write pack refuses to
    # boot (rw coverage gate). write_repos is the owner/repo allowlist gh api writes are permitted
    # under (POST/PATCH/PUT to /repos/{owner/repo}/...); empty => every gh api write default-denies.
    token_env_rw: null                       # e.g. OPENDEVOPS_GH_TOKEN_RW (a scoped write PAT)
    write_repos: []                          # allowlisted owner/repo write targets, e.g. [octo-org/staging-app]
  # Read-only cloud CLI families. credential_env lists the NAMES of the agent-process env
  # vars whose VALUES the executor injects for that family (never the values themselves). Empty =>
  # the family is unconfigured and its aws/gcloud/az-read pack refuses to boot (coverage gate),
  # exactly like github above. Point these at a READ-ONLY role/SA/SP whose IAM policy Denies secret
  # material (secretsmanager:GetSecretValue, ssm:GetParameter* decrypt, kms:Decrypt) — the policy
  # packs are the compensating control atop that role, not a substitute for it.
  aws:
    credential_env: []                        # e.g. [AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_SESSION_TOKEN, AWS_REGION]
  gcloud:
    credential_env: []                        # e.g. [GOOGLE_APPLICATION_CREDENTIALS, CLOUDSDK_CORE_PROJECT]
  azure:
    credential_env: []                        # 'az' family; e.g. [AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET]
  # Read-only remote-exec ('ssh' family / the structured ssh_run tool). The model supplies
  # only an allowlisted host + the remote argv; user/key/port/known_hosts are pinned HERE. Unset =>
  # the ssh family is unconfigured and packs/ssh.yaml refuses to boot (coverage gate), exactly like
  # github/aws above. Only the env-var NAME for the private key path lives in config, never a secret.
  ssh:
    hosts: []                                  # host allowlist; ssh_run is permitted only for a host in this list (empty => none reachable)
    user: null                                 # pinned remote login user, e.g. deploy
    key_env: null                              # NAME of the env var holding the PATH to the private key file, e.g. OPENDEVOPS_SSH_KEY
    key_passphrase_env: null                   # optional NAME of the env var holding the key passphrase (null => passphrase-less key)
    known_hosts_path: null                     # pinned known_hosts file (host-key verification is ON; null => ssh_run refuses, never disables checking)
    port: 22
execution: {cmd_timeout_seconds: 60, output_max_chars: 50000, env_allowlist: [PATH, HOME]}
executor:                                    # Executor split. Default local = the in-process executor (holds creds+secrets); remote splits execution into a separate service.
  mode: local                                # local | remote. remote is EXPERIMENTAL — not production-deployable until the ops/executor/README.md "Pre-deployment gates" close (token must bind environment + service (env,channel) self-check + per-(env,channel) client routing). ssh_run always stays agent-side (holds the SSH key) even on remote.
  url: null                                  # remote: executor service base URL, e.g. http://executor:8090 (required when mode=remote)
  signing_key_env: null                      # remote (agent): NAME of the env var holding the ed25519 PRIVATE signing key (base64 raw 32 bytes); required when mode=remote
  verify_key_env: null                       # remote (service): NAME of the env var holding the ed25519 PUBLIC verify key (base64 raw 32 bytes); the service holds the public key only
  secret_source: env                         # {{secret:NAME}} backend (env-var-backed to start; a future vault plugs into the same SecretSource seam)
  secret_env_prefix: ""                      # optional prefix prepended to NAME for the {{secret:NAME}} env lookup (namespacing)
audit: {dir: ./audit}
policy: {dir: ./config/policy}
state: {dir: ./state}                       # LocalGateway checkpointer sqlite db (0o700 dir)
server:                                      # service mode: self-hosted LangGraph Server for ServerGateway
  url: http://localhost:8123                 # server base URL; unset => service mode is disabled
  api_key_env: LANGGRAPH_API_KEY             # NAME of the env var holding the server API key (or null for no auth)
  # Webhook app (mounted via langgraph.json http.app). Every secret is a NAME of an env var,
  # never a value; a route whose named env var is unset fails CLOSED (503), never "auth disabled".
  alertmanager_token_env: null               # env var holding the Alertmanager bearer token (also auths run-complete); null => 503
  github_webhook_secret_env: null            # env var holding the GitHub webhook HMAC secret; null => 503
  source_allowlist: []                       # client IPs allowed to POST /webhooks/alertmanager (empty => allow all); direct peer only, proxy headers ignored (Caddy fronts this)
  webhook_environment: staging               # policy-environment overlay for webhook-initiated runs (staging|prod)
slack:                                        # Slack Socket-Mode chat-ops adapter (opt-in; interfaces/slack_app.py)
  bot_token_env: null                        # NAME of the env var holding the bot token (xoxb-...); null => starting the adapter errors
  app_token_env: null                        # NAME of the env var holding the app-level token (xapp-...); null => starting the adapter errors
  default_channel_environment: staging       # policy-environment overlay for Slack-initiated runs (staging|prod)
scheduler:                                    # our own APScheduler service (interfaces/scheduler/); jobs in scheduler/jobs.yaml
  jobs_file: scheduler/jobs.yaml             # path to the job set (fixed knobs misfire=300/coalesce/max_instances=1/jitter=60 applied to every job)
  principal: scheduler                       # principal scheduled runs are attributed to (audit user + per-principal daily budget scope)
principals: {}                               # slack user id -> {principal, profile}
