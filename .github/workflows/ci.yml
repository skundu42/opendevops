name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Compile strict TypeScript dashboard
        run: |
          npm ci
          npm run frontend:check
          npm run frontend:build

      - name: Sync dependencies
        # All extras: the suite imports from every one — checkpoint (AsyncSqliteSaver), server
        # (langgraph-sdk, redis, fastapi), slack (slack-bolt, apscheduler → scheduler tests),
        # ssh (asyncssh → ssh_run tests), dev (pytest, fakeredis).
        run: uv sync --extra checkpoint --extra server --extra slack --extra ssh --extra dev

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        # ops/ (the maintenance/probe CLIs) is included deliberately — it is not in the shipped wheel.
        run: uv run mypy src ops

      - name: Pytest
        run: uv run pytest
