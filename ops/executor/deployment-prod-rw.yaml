# opendevops executor service — hardened deployment (prod/rw) — P5d.
#
# Separate deployment per (environment, channel) so each holds EXACTLY ONE credential set: the
# prod rw infra credential + secret source live in THIS pod's env only (never the agent's).
# Every hardening field below is asserted by tests/unit/test_executor_manifests.py (parsed as YAML,
# no live cluster): gVisor runtimeClass, non-root, read-only rootfs, cap-drop ALL, seccomp
# RuntimeDefault, and a tmpfs /work. The egress allowlist + IMDS block live in networkpolicy.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opendevops-executor-prod-rw
  namespace: opendevops-executor
  labels: {app: opendevops-executor, env: prod, channel: rw}
spec:
  replicas: 1
  selector:
    matchLabels: {app: opendevops-executor, env: prod, channel: rw}
  template:
    metadata:
      labels: {app: opendevops-executor, env: prod, channel: rw}
    spec:
      runtimeClassName: gvisor            # gVisor sandbox (PLAN §3.5)
      automountServiceAccountToken: false
      serviceAccountName: opendevops-executor-prod-rw
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          image: opendevops-executor:latest
          args:
            - uvicorn
            - opendevops.executor_service.service:build_app_from_env
            - --factory
            - --host
            - 0.0.0.0
            - --port
            - "8090"
          ports:
            - containerPort: 8090
          env:
            - name: OPENDEVOPS_EXECUTOR_ENV
              value: "prod"
            - name: OPENDEVOPS_EXECUTOR_CHANNEL
              value: "rw"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: work
              mountPath: /work
          resources:
            limits: {cpu: "1", memory: 512Mi}
            requests: {cpu: 100m, memory: 128Mi}
      volumes:
        - name: work                       # per-call tmpfs scratch (staging tmpdir + sandbox HOME)
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
