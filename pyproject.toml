[project]
name = "opendevops"
dynamic = ["version"]
description = "Autonomous DevOps agent: policy-gated, budget-capped, audit-chained operations on Kubernetes, GitHub, cloud CLIs, and SSH"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Sandipan Kundu" }]
keywords = ["devops", "agent", "llm", "kubernetes", "sre", "automation", "langchain", "langgraph"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: System Administrators",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Systems Administration",
]
requires-python = ">=3.11,<4.0"
dependencies = [
  "deepagents==0.6.12", "langchain==1.3.14", "langgraph==1.2.9",
  "langchain-anthropic>=1.4.7,<2",
  "pydantic-settings>=2.6", "pyyaml>=6", "typer>=0.15", "rich>=13",
]

[project.optional-dependencies]
checkpoint = ["langgraph-checkpoint-sqlite", "aiosqlite"]
server     = [
  "langgraph-sdk>=0.4,<0.5", "fastapi", "sse-starlette", "redis>=5",
  "prometheus-client", "authlib>=1.6,<2", "httpx>=0.27,<1",
  "opentelemetry-api>=1.30,<2", "opentelemetry-sdk>=1.30,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
]
slack      = ["slack-bolt==1.30.0", "aiohttp", "apscheduler>=3.10,<4"]
ssh        = ["asyncssh==2.24.0"]
# The executor service needs cryptography (ed25519), httpx, and fastapi — all already resolved +
# pinned in uv.lock (cryptography/httpx transitively; fastapi via the `server` extra), so a
# dedicated `executor` extra is intentionally omitted (it would only add lockfile metadata). The
# executor service image installs the package plus the already-pinned fastapi (ops/executor/README.md).
dev        = ["pytest", "pytest-asyncio", "ruff", "mypy",
              "agentevals==0.0.9", "langgraph-cli[inmem]==0.4.31",
              "fakeredis>=2.31,<3"]

[project.urls]
Homepage = "https://github.com/skundu42/opendevops"
Repository = "https://github.com/skundu42/opendevops"
Issues = "https://github.com/skundu42/opendevops/issues"

[project.scripts]
opendevops = "opendevops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendevops"]

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/frontend",
  "/src",
  "/tests",
  "/config",
  "/ops/k8s",
  "/hatch_build.py",
  "/package.json",
  "/package-lock.json",
  "/tsconfig.json",
  "/pyproject.toml",
  "/README.md",
  "/LICENSE",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.version]
path = "src/opendevops/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
