# opendevops executor service namespace . Isolated from the workloads the agent manages
# and from the ops stack (docker-compose.yml) — a blast-radius boundary (guides/deployment.md).
apiVersion: v1
kind: Namespace
metadata:
  name: opendevops-executor
  labels:
    app: opendevops-executor
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
