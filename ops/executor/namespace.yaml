# opendevops executor service namespace (P5d). Isolated from the workloads the agent manages
# and from the ops stack (docker-compose.yml) — a blast-radius boundary (PLAN §3.7).
apiVersion: v1
kind: Namespace
metadata:
  name: opendevops-executor
  labels:
    app: opendevops-executor
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
