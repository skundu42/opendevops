[project]
name = "opendevops"
version = "0.1.0"
description = "Autonomous DevOps agent on LangChain deepagents"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "deepagents==0.6.12", "langchain==1.3.14", "langgraph==1.2.9",
  "langchain-anthropic>=1.4.7,<2",
  "pydantic-settings>=2.6", "pyyaml>=6", "typer>=0.15", "rich>=13",
]

[project.optional-dependencies]
p2     = ["langgraph-checkpoint-sqlite", "aiosqlite"]
server = ["langgraph-sdk>=0.4,<0.5", "fastapi", "sse-starlette", "redis>=5", "prometheus-client"]
slack  = ["slack-bolt==1.30.0", "aiohttp", "apscheduler>=3.10,<4"]
ssh    = ["asyncssh==2.24.0"]
# P5d executor split needs cryptography (ed25519), httpx (remote client) and fastapi (service).
# All three are already RESOLVED + pinned in uv.lock (cryptography/httpx transitively; fastapi via
# the `server` extra), so NO new dependency is introduced and uv.lock is unchanged — a dedicated
# `executor` extra is intentionally omitted (it would only add lockfile metadata). The executor
# service image installs the package plus the already-pinned fastapi (see ops/executor/README.md).
dev    = ["pytest", "pytest-asyncio", "ruff", "mypy",
          "agentevals==0.0.9", "langgraph-cli[inmem]==0.4.31",
          "fakeredis>=2.31,<3"]

[project.scripts]
opendevops = "opendevops.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opendevops"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
