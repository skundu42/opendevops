# Prometheus scrape + rule config for opendevops.
#
# Scrapes run INSIDE the compose network (bypassing Caddy — no bearer token needed): the LangGraph
# Server exposes the webhook app's /metrics (prometheus_client), and Vector exposes
# its own health/lag metrics. The alert rules live in alerts.yml.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: opendevops

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The webhook app mounted on the LangGraph Server (langgraph.json http.app):
  #   opendevops_webhook_requests_total{route,outcome}, opendevops_runs_started_total{interface}
  - job_name: langgraph-server
    metrics_path: /metrics
    static_configs:
      - targets: ["langgraph-server:8000"]
        labels:
          service: langgraph-server

  # Vector's own metrics (internal_metrics -> prometheus_exporter): shipper throughput/lag/errors.
  - job_name: vector
    metrics_path: /metrics
    static_configs:
      - targets: ["vector:9598"]
        labels:
          service: vector

  # Prometheus scrapes itself (up{} heartbeat + rule-eval health).
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
